---
# yaml-language-server: $schema=https://kubernetes-schemas.ergho.org/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  timeout: 10m
  values:
    cephClusterSpec:
      cephConfig:
        mon:
          mon_cluster_log_level: info
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        cephfs:
          kernelMountOptions: ms_mode=prefer-crc
        readAffinity:
          enabled: false # https://github.com/ceph/ceph-csi/issues/5772
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
      healthCheck:
        muteHealthWarning:
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      mgr:
        modules:
          - name: pg_autoscaler
            enabled: true
      network:
        provider: host
      resources:
        osd:
          limits:
            memory: 8Gi # Required for bootstrap
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            keyType: aes # aes256k requires kernel 7.0+
      storage:
        useAllNodes: false
        useAllDevices: false
        config:
          osdsPerDevice: "1"
        nodes:
          - name: k8worker-1
            devices:
              - name: "/dev/disk/by-id/nvme-KINGSTON_SKC3000S1024G_50026B7685F93BDD"
          - name: k8worker-2
            devices:
              - name: "/dev/disk/by-id/nvme-KINGSTON_SKC3000S1024G_50026B7685F93BFF"
          - name: k8worker-3
            devices:
              - name: "/dev/disk/by-id/nvme-KINGSTON_SKC3000S1024G_50026B7685F93BBA"
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: "rook.ergho.org"
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: networking
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          allowVolumeExpansion: true
          isDefault: true
          mountOptions:
            - discard
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      deletionPolicy: Delete
      isDefault: true
    cephFileSystems: []
      #- name: ceph-filesystem
      #  spec:
      #    metadataPool:
      #      replicated:
      #        size: 3
      #    dataPools:
      #      - failureDomain: host
      #        replicated:
      #          size: 3
      #        name: data0
      #    metadataServer:
      #      activeCount: 1
      #      activeStandby: true
      #      resources:
      #        requests:
      #          cpu: 1000m
      #          memory: 1Gi
      #        limits:
      #          memory: 4Gi
      #  storageClass:
      #    enabled: true
      #    isDefault: false
      #    name: ceph-filesystem
      #    pool: data0
      #    reclaimPolicy: Delete
      #    allowVolumeExpansion: true
      #    parameters:
      #      csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
      #      csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
      #      csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
      #      csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
      #      csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
      #      csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
      #      csi.storage.k8s.io/fstype: ext4
      #    volumeBindingMode: Immediate
    cephFileSystemsVolumeSnapshotClass:
      enabled: false
      #name: csi-ceph-filesystem
      #isDefault: false
      #deletionPolicy: Delete
    cephObjectStores:
      - name: ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          dataPool:
            failureDomain: host
            erasureCoded:
              dataChunks: 2
              codingChunks: 1
          preservePoolsOnDelete: true
          gateway:
            port: 80
            resources:
              requests:
                cpu: 1000m
                memory: 1Gi
              limits:
                memory: 2Gi
            instances: 1
          healthCheck:
            bucket:
              interval: 60s
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Delete
          parameters:
            region: us-east-1
