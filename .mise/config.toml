[env]
FLATE_PATH = '{{config_root}}/cluster/flux/cluster'
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

[hooks]
postinstall = "lefthook install"

[tools]
actionlint = "1.7.12"
"github:mitsuhiko/minijinja" = "3.0.4"
go-containerregistry = "0.22.1"
jq = "1.8.2"
just = "1.59.0"
lefthook = "2.2.2"
node = "26.12.1"
oxfmt = "0.74.0"
podman = "v6.1.4"
shellcheck = "0.11.0"
yq = "4.54.1"
zizmor = "1.31.1"
